version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: "/app"
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: "/package"
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
