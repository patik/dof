<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,minimal-ui,viewport-fit=cover" />
        <meta name="author" content="Craig Patik" />
        <meta name="description" content="Depth of field calculator and camera lens comparison tool" />
        <meta
            name="keywords"
            content="depth of field, camera, lens, photography, calculator, compare, comparison"
        />
        <meta name="HandheldFriendly" content="True" />
        <meta name="MobileOptimized" content="320" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-touch-fullscreen" content="yes" />
        <link rel="canonical" href="https://patik.com/dof/" />
        <link rel="icon" href="/favicon.ico" />
        <title>Depth of Field Calculator &amp; Comparison Tool for Camera Lenses</title>
        <script>
            ;(() => {
                try {
                    const storedTheme = localStorage.getItem('dof-theme')
                    const theme =
                        storedTheme === 'light' || storedTheme === 'dark'
                            ? storedTheme
                            : matchMedia('(prefers-color-scheme: dark)').matches
                              ? 'dark'
                              : 'light'

                    document.documentElement.dataset.theme = theme
                    document.documentElement.style.colorScheme = theme
                } catch {
                    document.documentElement.dataset.theme = 'light'
                    document.documentElement.style.colorScheme = 'light'
                }
            })()
        </script>
    </head>
    <body>
        <noscript>
            <p>This tool requires <a href="https://enable-javascript.com/">JavaScript</a>.</p>
        </noscript>
        <div id="root">
            <main>
                <h1>Depth of Field Calculator &amp; Lens Comparison Tool</h1>
                <p>Compare multiple camera lenses side by side.</p>
            </main>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
